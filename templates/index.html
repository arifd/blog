{% extends "base.html" %}

{% block title %}{{ config.title }}{% endblock %}

{% block content %}
{% if section.pages %}
<ul class="post-list">
{% for page in section.pages %}
    <li>
        <div class="post-title"><a href="{{ page.path }}">{{ page.title }}</a></div>
        {% if page.extra.date %}
        <div class="post-meta">{{ page.extra.date }}</div>
        {% endif %}
    </li>
{% endfor %}
</ul>
{% endif %}
{% endblock %}
